name: Actualizar universo de empresas

on:
  schedule:
    - cron: "17 3 * * 2-6"     # 10:17 p. m. de Colombia, de lunes a viernes (después del cierre de Nueva York)
  workflow_dispatch:            # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar paquetes
        run: pip install -r requirements.txt
      - name: Descargar universo y fundamentales
        run: python actualizar_universo.py
      - name: Guardar el universo en el repositorio
        run: |
          git config user.name "actualizador-universo"
          git config user.email "actions@users.noreply.github.com"
          git add data/universo.csv
          git diff --cached --quiet || git commit -m "Universo actualizado $(date +%Y-%m-%d)"
          git push
